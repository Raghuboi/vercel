[project]
name = "pyproject-subscriber"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "celery>=5.6.3",
]

[tool.setuptools]
packages = ["subscriber_a", "subscriber_b"]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.subscribers.high-priority-subscriber]
entrypoint = "subscriber_a:app"
topics = ["high-priority"]

[tool.vercel.subscribers.low-priority-subscriber]
entrypoint = "subscriber_b:app"
topics = ["low-priority"]
